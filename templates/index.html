
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Freshness Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🍎 Fruit Freshness Detection</h1>

        <p class="subtitle">
            Upload a fruit image to check its freshness using CNN
        </p>

        <form action="/" method="POST" enctype="multipart/form-data">

            <input type="file" name="file"
                   accept="image/*" required>

            <button type="submit">Detect Freshness</button>

        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if image_path %}
            <div class="result">

                <h2>Uploaded Fruit Image</h2>

                <img src="{{ image_path }}" alt="Uploaded fruit">

                <h2>Prediction: {{ prediction }}</h2>

                <p>Model confidence: {{ confidence }}%</p>

            </div>
        {% endif %}

        <div class="footer">
            <p>Powered by CNN and Deep Learning</p>
        </div>

    </div>

</body>
</html>
